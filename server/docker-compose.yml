# OBDient2 — servicios en la Z440 (ADR-0006).
#
#   GPU0 · en línea   llm-chat: Qwen3.8-27B INT4, siempre cargado, una sola GPU.
#   GPU1 · voz + lotes  stt: Voxtral Mini 4B Realtime (perfil `stt`, ~16 GB); lo que
#                     quede, lotes (worker del maestro, Qwen-Drive diferido).
#   CPU               (próximo) OSRM + Photon, ingesta de fotos.
#
# Perfiles: `docker compose --profile online up -d` levanta lo de GPU0.
# Las GPUs van por UUID (no por índice), como en ~/serve.
# Red de host: escucha solo en la IP de la LAN; ufw sí filtra el puerto.
#
# Desplegar:  scp server/docker-compose.yml fiui-pss@192.168.100.210:~/obdient-stack/
#             ssh fiui-pss@192.168.100.210 'cd ~/obdient-stack && docker compose --profile online up -d'
# La clave de la API se lee de ~/obdient-stack/.env (VLLM_API_KEY), copia de ~/serve/.env.

name: obdient

x-gpu0: &gpu0
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["GPU-8e2f7908-bea0-9010-5bae-78a82a3ca503"]
            capabilities: [gpu]

x-gpu1: &gpu1
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["GPU-f7440548-72f4-8d46-7eed-6ceffb58fe4a"]
            capabilities: [gpu]

services:
  llm-chat:
    profiles: [online]
    <<: *gpu0
    # vLLM 0.31.0, el mismo digest probado en ~/serve.
    image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    container_name: llm-chat
    network_mode: host
    ipc: host
    restart: unless-stopped # si la guardia térmica lo para, NO se reinicia solo
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY}
    volumes:
      - /home/fiui-pss/models:/models:ro
    # Una sola GPU (sin TP): el enlace PCIe entre las 3090 no tiene NVLink.
    # 19 GB de pesos INT4 + caché KV en FP8 con contexto moderado.
    # --enable-sleep-mode: los pesos pueden pasar a la RAM en segundos para
    # prestar la GPU a un lote, sin reiniciar el servidor.
    # Forma de lista: cada argumento llega tal cual (el JSON necesita sus comillas).
    command:
      - /models/qwen3.8-27b-int4
      - --served-model-name=qwen3.8-27b
      - --host=192.168.100.210
      - --port=8000
      - --max-model-len=16384
      - --gpu-memory-utilization=0.92
      - --kv-cache-dtype=fp8
      - --max-num-seqs=8
      - '--limit-mm-per-prompt={"image":2,"video":0}'
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder # el modelo emite <function=…><parameter=…>
      - --enable-sleep-mode
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://192.168.100.210:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  # Voz a texto en vivo (M6): Voxtral Mini 4B Realtime, WebSocket /v1/realtime.
  # Audio PCM16 a 16 kHz en base64; devuelve transcription.delta / .done. La app
  # llega por obdient-tools en la K16 (/tools/v1/stt), nunca directo.
  # Pesos: hf download mistralai/Voxtral-Mini-4B-Realtime-2602 --local-dir ~/models/voxtral-mini-4b-realtime-2602
  # Retardo de transcripción: transcription_delay_ms en tekken.json (480 ms por defecto).
  stt:
    profiles: [stt]
    <<: *gpu1
    # La imagen de llm-chat (vLLM 0.31.0) + las librerías de audio (stt/Dockerfile):
    # la original no trae soundfile y el motor no arranca.
    build: ./stt
    image: obdient/stt:vllm-0.31.0-audio
    container_name: stt
    network_mode: host
    ipc: host
    restart: unless-stopped # si la guardia térmica lo para, NO se reinicia solo
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY}
      - VLLM_DISABLE_COMPILE_CACHE=1
    volumes:
      - /home/fiui-pss/models:/models:ro
    command:
      - /models/voxtral-mini-4b-realtime-2602
      - --served-model-name=voxtral-realtime
      - --host=192.168.100.210
      - --port=8002
      - --tokenizer-mode=mistral
      - --enforce-eager
      # Frases cortas: 8k tokens de audio (80 ms cada uno) son ~10 min por sesión.
      - --max-model-len=8192
      # ~16 GB de 24: lo demás queda para lotes chicos en la misma GPU.
      - --gpu-memory-utilization=0.70
      - --max-num-seqs=4
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://192.168.100.210:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  # Embeddings (M9, 2026-10-21): Qwen3-Embedding-0.6B para la base de textos del
  # laboratorio (páginas leídas, PDFs). La app no le habla: pasa por
  # obdient-tools en la K16. GPU1, al lado de stt: ~3 GB.
  # Pesos: hf download Qwen/Qwen3-Embedding-0.6B --local-dir ~/models/qwen3-embedding-0.6b
  # La arquitectura es Qwen3ForCausalLM: sin --runner/--convert vLLM lo sirve
  # como modelo de chat. Consultas con "Instruct: …\nQuery:…"; documentos sin nada.
  embed:
    profiles: [embed]
    <<: *gpu1
    image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    container_name: embed
    network_mode: host
    ipc: host
    restart: unless-stopped # si la guardia térmica lo para, NO se reinicia solo
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY}
      - VLLM_DISABLE_COMPILE_CACHE=1
    volumes:
      - /home/fiui-pss/models:/models:ro
    command:
      - /models/qwen3-embedding-0.6b
      - --served-model-name=qwen3-embedding-0.6b
      - --host=192.168.100.210
      - --port=8003
      - --runner=pooling
      - --convert=embed
      - --enforce-eager
      # Fragmentos de ~1 página; 8k alcanza y deja la caché chica.
      - --max-model-len=8192
      # ~3 GB de 24: stt usa 0.70; la suma queda debajo de 0.85.
      - --gpu-memory-utilization=0.12
      - --max-num-seqs=16
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://192.168.100.210:8003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  # ── CPU: rutas y búsqueda (perfil propio: sigue en pie aunque se pare lo de GPU) ──
  # Datos preparados por server/maps/prepare.sh en ~/obdient-stack/maps.
  # Solo LAN: la K16 (Caddy) es la única entrada desde internet.
  osrm:
    profiles: [cpu]
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    container_name: osrm
    network_mode: host
    restart: unless-stopped
    cpus: 2
    mem_limit: 4g
    volumes:
      - /home/fiui-pss/obdient-stack/maps/osrm:/data:ro
    command:
      - osrm-routed
      - --algorithm=mld
      - --ip=192.168.100.210
      - --port=5000
      - --max-table-size=1000
      - /data/argentina-latest.osrm
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  photon:
    profiles: [cpu]
    image: eclipse-temurin:21-jre
    container_name: photon
    network_mode: host
    restart: unless-stopped
    cpus: 2
    mem_limit: 6g
    volumes:
      - /home/fiui-pss/obdient-stack/maps/photon:/photon
    # Photon 1.3: subcomando `serve`; -data-dir contiene photon_data/ (índice Argentina 1.0).
    command:
      - java
      - -Xmx3g
      - -jar
      - /photon/photon.jar
      - serve
      - -data-dir
      - /photon
      - -listen-ip
      - 192.168.100.210
      - -listen-port
      - "2322"
      - -default-language
      - es
      - -j
      - "2"
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
